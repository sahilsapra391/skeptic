[project]
name = "skeptic-backend"
version = "0.1.0"
description = "Skeptic FastAPI backend — see docs/TECH-SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "boto3>=1.34",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # launch L1: Clerk session-JWT verification (JWKS, RS256)
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    # schema-parity tests (spec ↔ strategy-spec.schema.json) actually run
    # instead of skipping (review finding F4 #8)
    "jsonschema>=4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

# strict typing on the correctness-critical packages (CLAUDE.md conventions)
[[tool.mypy.overrides]]
module = ["app.models.*", "app.engine.*", "app.honesty.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lake: touches the live R2 lake (auto-skips without credentials)",
]
