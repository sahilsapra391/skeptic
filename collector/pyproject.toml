[project]
name = "skeptic-collector"
version = "0.1.0"
description = "Skeptic EOD options data pipeline — see docs/DATA-PIPELINE.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "exchange-calendars>=4.5",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "requests>=2.32",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
