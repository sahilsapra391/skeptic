name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # V-58: two guards in this suite run REAL TypeScript through node's
      # native type stripping (22.6+) rather than a Python copy of it: the V-18
      # round-trip guard on frontend/lib/spec.ts, and the normalizer parity
      # guard on frontend/lib/punctuation.ts. Node is a HARD dependency of
      # both. Without it they fail rather than skipping, so it is pinned here
      # instead of relying on whatever the runner happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      # V-221: a guard that can vanish without a sound is not a guard. The step
      # below runs the whole suite, and a suite is silent about a test that is
      # no longer in it: delete the em-dash guard, rename it, or add it to an
      # ignore list and `uv run pytest -q` goes green having checked nothing.
      # That is how the pointer-sha hook died, and it took a day to notice.
      #
      # So the three em-dash guards are named BY PATH here, which makes their
      # absence a hard error instead of a quiet subtraction. `test -f` catches a
      # delete or a rename; pytest then exits 5 ("no tests collected") if the
      # files are on disk but something suppressed them. Paths are relative to
      # this job's working-directory (backend), the same as the suite below.
      - name: the em-dash guards exist and run
        run: |
          test -f tests/test_no_em_dash.py
          test -f tests/test_normalizer_parity.py
          test -f tests/test_em_dash_runtime.py
          uv run pytest -q \
            tests/test_no_em_dash.py \
            tests/test_normalizer_parity.py \
            tests/test_em_dash_runtime.py
      - run: uv run pytest -q

  # F0 guard: collector/ledger.py imports backend modules by path
  # (app.data.resolution + app.data.uw). This smoke-import fails in CI
  # (instead of at the 2 AM nightly ledger) if that chain ever grows a
  # dependency the collector env doesn't ship (the resolution-map rebuild
  # the self-improvement loop depends on rides on this import).
  # The deploy image had never been built by anything except Railway itself.
  # That gap is why a container which cannot start reached production twice:
  # the backend job below runs on local SQLite, where the migration guard cannot
  # fire, and nothing anywhere built the artifact that actually ships. This job
  # builds it on every PR, on linux/amd64, from a clean checkout with no cache,
  # which is Railway's platform and Railway's cache state.
  #
  # It builds and boots. Building only proves the Dockerfile parses; booting
  # proves the thing Railway's healthcheck asks, which is whether the process
  # binds a port and answers. DATABASE_URL is left unset so the container runs
  # on ephemeral SQLite and needs no secret.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the deploy image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: skeptic-backend:ci
      - name: the migration flag the deploy path must set
        # V-149's guard refuses a remote migration without this and raises at
        # import, so an image missing it cannot start on Railway. Checked here
        # against the built image, not against the Dockerfile's text.
        run: |
          value=$(docker run --rm skeptic-backend:ci printenv SKEPTIC_ALLOW_REMOTE_MIGRATION)
          echo "SKEPTIC_ALLOW_REMOTE_MIGRATION=$value"
          test "$value" = "1"
      - name: it binds a port and answers a healthcheck
        run: |
          docker run -d --name ci-boot -p 8000:8000 -e PORT=8000 skeptic-backend:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:8000/api/health || true)
            [ "$code" = "200" ] && { echo "healthy after ${i}s"; cat /tmp/health.json; exit 0; }
            sleep 1
          done
          echo "NEVER BECAME HEALTHY: this is the Railway failure, caught pre-merge"
          docker logs ci-boot 2>&1 | tail -40
          exit 1
      - name: stop
        if: always()
        run: docker rm -f ci-boot || true

  collector-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run python -c "import ledger, derive_ivs_signals, derive_flow_signals, derive_cross_validation, derive_cboe_eod, derive_inhouse_signals, derive_fill_calibration, derive_flow_inhouse"
      # collector/tests: state-poisoning guards for the UW backfill resume ledger
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
