name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q

  # F0 guard: collector/ledger.py imports backend modules by path
  # (app.data.resolution + app.data.uw). This smoke-import fails in CI —
  # instead of at the 2 AM nightly ledger — if that chain ever grows a
  # dependency the collector env doesn't ship (the resolution-map rebuild
  # the self-improvement loop depends on rides on this import).
  collector-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -c "import ledger, derive_ivs_signals, derive_flow_signals, derive_cross_validation, derive_cboe_eod, derive_inhouse_signals, derive_fill_calibration"
      # collector/tests: state-poisoning guards for the UW backfill resume ledger
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
