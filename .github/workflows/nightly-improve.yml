name: nightly-improve

# ENGINE-V3 D3: the auto-improvement pass. Runs OFF-PEAK (07:00 UTC =
# 02:00–03:00 ET), after the nightly collectors and the coverage ledger,
# Tue–Sat (following Mon–Fri sessions). The scan decides WHAT should
# re-run; the Railway backend executes via POST /api/backtest (this
# workflow never runs the engine). Capped re-runs per night — see
# backend/scripts/nightly_improve.py.

on:
  schedule:
    - cron: "0 7 * * 2-6"
  workflow_dispatch:
    inputs:
      execute:
        description: "Submit re-runs (unchecked = dry-run report only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Unlock scan (+ capped auto re-runs)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKEPTIC_API_URL: ${{ secrets.SKEPTIC_API_URL }}
          SKEPTIC_ACCESS_TOKEN: ${{ secrets.SKEPTIC_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          EXECUTE="${{ github.event_name == 'schedule' && 'true' || inputs.execute }}"
          if [ "$EXECUTE" = "true" ]; then
            PYTHONPATH=. uv run python scripts/nightly_improve.py --execute
          else
            PYTHONPATH=. uv run python scripts/nightly_improve.py
          fi
