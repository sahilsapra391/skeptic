name: nightly-improve

# ENGINE-V3 D3: the auto-improvement pass. Runs OFF-PEAK (07:00 UTC =
# 02:00–03:00 ET), after the nightly collectors and the coverage ledger.
# The scan decides WHAT should re-run; the Railway backend executes via
# POST /api/backtest (this workflow never runs the engine). Capped re-runs
# per night — see backend/scripts/nightly_improve.py.
#
# SPLIT ACROSS TWO HOSTS on 2026-08-04 (after the Jul 27–31 billing block). The Tue–Sat nightly scan moved to the
# collector VM (systemd skeptic-improve.timer, 07:00 UTC). Only the Saturday
# weekly pass stayed here, because it opens a proposal PR and that needs repo
# write — the VM holds a read-only deploy key by deliberate design, and an
# always-on box should not gain push access to the repo that deploys prod.

on:
  schedule:
    # Saturday only, 30 min behind the VM's 07:00 UTC scan so the original
    # scan-then-weekly ordering survives the split across hosts.
    - cron: "30 7 * * 6"
  workflow_dispatch:
    inputs:
      execute:
        description: "Submit re-runs (unchecked = dry-run report only)"
        type: boolean
        default: true
      weekly:
        description: "Force the weekly calibration + priorities pass"
        type: boolean
        default: false

# contents+pull-requests write: the WEEKLY calibration step may open a
# reviewed proposal PR (D3d, owner amendment 2) — defaults change only
# through that PR, never at runtime. Everything else only reads the repo.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Unlock scan (+ capped auto re-runs)
        # Manual runs only. On the Saturday schedule the VM already scanned at
        # 07:00 UTC, and running it again here would double-submit that night's
        # capped re-runs. A skipped step does not fail the job, so the weekly
        # pass below still runs on schedule.
        if: github.event_name == 'workflow_dispatch'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKEPTIC_API_URL: ${{ secrets.SKEPTIC_API_URL }}
          SKEPTIC_ACCESS_TOKEN: ${{ secrets.SKEPTIC_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          EXECUTE="${{ inputs.execute }}"
          if [ "$EXECUTE" = "true" ]; then
            PYTHONPATH=. uv run python scripts/nightly_improve.py --execute
          else
            PYTHONPATH=. uv run python scripts/nightly_improve.py
          fi

      # D3d weekly pass (Saturdays, after the week's collection): demand
      # ranking + fill-model calibration. A calibration divergence beyond
      # the documented bar opens a PROPOSAL PR (asymmetric evidence bar;
      # optimism-increasing changes carry the title prefix) — nothing
      # changes until a human merges it.
      - name: Weekly calibration + collection priorities (Saturdays)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" != "6" ] && [ "${{ inputs.weekly }}" != "true" ]; then
            echo "not Saturday — weekly pass skipped"
            exit 0
          fi
          git config user.name "sahilsapra391"
          git config user.email "sahilsapra391@gmail.com"
          PYTHONPATH=. uv run python scripts/build_priorities.py --execute
          PYTHONPATH=. uv run python scripts/calibrate_fill_model.py --execute
