name: collect-eod

# Scheduling moved to the collector VM on 2026-08-04 (systemd
# skeptic-collect-eod.timer holds the same 21:30 + 22:30 UTC slots, so the
# Healthchecks check is unchanged). Private-repo Actions minutes bill against
# the account, and a billing block refused to start this job outright: both
# scheduled runs died in under 5s, before collect.py could ping success OR
# /fail, and only the silent Healthchecks tile caught it.
#
# This stays as the manual fallback for when the VM is down. It costs nothing
# while idle. Do NOT re-add a cron here without first disabling the VM timer,
# or both hosts run the chain against the same lake.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Collector mode"
        type: choice
        options: [all, eod, backfill, underlying, quality]
        default: all
      backfill_limit:
        description: "Cap AV requests spent on backfill (blank = budget-limited)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # The `concurrency` group above only serializes this against OTHER
      # Actions runs. The nightly chain runs on the collector VM now, so the
      # lease in R2 is the only thing standing between a dispatch and a
      # head-on collision with it over one 200 req/min Alpaca budget.
      # Everything below is gated on this step succeeding — including the
      # `always()` derivations, which would otherwise run anyway and write the
      # same lake the holder is writing.
      - name: Acquire the collector lease (cross-host mutex)
        id: lease
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HOLDER: github-actions/${{ github.workflow }}#${{ github.run_id }}
        # --ttl covers this job's own 45-min wall (2700s) plus margin, so a
        # runner that dies without releasing frees the lane before the VM's
        # 22:30 catch-up rather than wedging the night.
        run: >
          uv run python lock.py acquire
          --holder "$HOLDER" --ttl 3000
          --token-file "$RUNNER_TEMP/collector.lock.token"

      - name: Run collector
        working-directory: collector
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'all' }}"
          LIMIT="${{ github.event_name == 'workflow_dispatch' && inputs.backfill_limit || '' }}"
          if [ -n "$LIMIT" ]; then
            uv run python collect.py --mode "$MODE" --backfill-limit "$LIMIT"
          else
            uv run python collect.py --mode "$MODE"
          fi

      - name: Minute-lake top-up (Alpaca, DATA-PIPELINE job 4)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'all' || inputs.mode == 'eod' }}
        working-directory: collector
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python alpaca.py --mode eod

      - name: Coverage report
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python coverage.py

      - name: CBOE close chain derivation (forward record — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_cboe_eod.py

      - name: In-house signal derivation (forward record — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_inhouse_signals.py

      - name: IVS signal derivation (ENGINE-V4 F4 — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_ivs_signals.py

      - name: Flow signal derivation (ENGINE-V4 F2/F3 — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_flow_signals.py

      - name: In-house flow family (forward record — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_flow_inhouse.py

      - name: Cross-source validation (ENGINE-V4 F7 — incremental)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_cross_validation.py

      - name: Fill-model calibration (D3d — no-op once the frozen tape is derived)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python derive_fill_calibration.py

      - name: Coverage ledger (ENGINE-V3 D3, data-arrival hook)
        if: ${{ always() && steps.lease.outcome == 'success' }}
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run python ledger.py

      # Unconditional: a cancelled or timed-out job must hand the lane back
      # too, or the VM's chain refuses to start tonight. No token file means
      # the lease was never taken (we refused, or died before it) — nothing
      # to release, and nothing to say about it.
      - name: Release the collector lease
        if: always()
        working-directory: collector
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -f "$RUNNER_TEMP/collector.lock.token" ] || exit 0
          uv run python lock.py release --token-file "$RUNNER_TEMP/collector.lock.token"
